services:
  - type: web
    name: the-shadow-sovereign-os
    env: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    disk:
      name: shadow-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PERSISTENT_DATA_DIR
        value: /var/data
      - key: TITO_STUDIO_API_URL
        value: https://t2-studio.vercel.app
      - key: T2_AGENT_API_URL
        value: https://khedr-bot-agent.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: ALLOW_INSECURE_HEADER_AUTH
        value: "false"
