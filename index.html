    <!-- Environment Variable Shim for Vercel/Runtime -->
    <script>
      (function() {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        
        // Critical: Detect keys injected by Vercel or Vite at runtime
        const possibleKeys = [
            window.VITE_API_KEY, 
            window.API_KEY,
            // @ts-ignore
            (typeof import !== 'undefined' && import.meta && import.meta.env ? import.meta.env.VITE_API_KEY : '')
        ];

        const validKey = possibleKeys.find(k => k && k.length > 10);
        
        if (validKey) {
            window.process.env.API_KEY = validKey;
            window.VITE_API_KEY = validKey;
        }
      })();
    </script>
