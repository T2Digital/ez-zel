<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الظل الرقمي | Ez-Zel</title>
    <meta name="description" content="أقوى مساعد شخصي حصين بالذكاء الاصطناعي مع تشفير كامل للبيانات واستوديو الموسيقى الذكي." />
    <meta property="og:title" content="الظل الرقمي | Ez-Zel" />
    <meta property="og:description" content="أقوى مساعد شخصي حصين بالذكاء الاصطناعي مع تشفير كامل للبيانات واستوديو الموسيقى الذكي." />
    
    <!-- Google Fonts for Arabic & Futuristic UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN for immediate flawless styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
              tajawal: ['Tajawal', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              cyber: {
                cyan: '#00f2fe',
                teal: '#4facfe',
                purple: '#7928ca',
                pink: '#ff0080',
                dark: '#070a13',
                card: '#0e1424',
                border: '#1f2942'
              }
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { boxShadow: '0 0 15px rgba(0, 242, 254, 0.4)' },
                '100%': { boxShadow: '0 0 35px rgba(0, 242, 254, 0.8), 0 0 15px rgba(121, 40, 202, 0.6)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Cairo', 'Tajawal', sans-serif;
        background-color: #05070d;
        color: #f1f5f9;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090d18;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }
    </style>
  </head>
  <body class="bg-[#05070d] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
